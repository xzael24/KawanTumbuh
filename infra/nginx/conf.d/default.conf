# ---------------------------------------------------------------------------
# KAWANTUMBUH - NGINX reverse proxy / API gateway
# Hanya file ini yang diekspos ke internet (port 80/443).
# ---------------------------------------------------------------------------

# Batasi request per IP.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream api_backend {
    server api:3000;
    keepalive 32;
}

# Diperlukan bila nanti ada endpoint WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Harus sama dengan STORAGE_MAX_UPLOAD_MB (12 MB) + sedikit overhead multipart.
    client_max_body_size 12m;
    client_body_timeout 30s;
    keepalive_timeout 65;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Health check internal untuk Docker (tidak menyentuh backend).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Health check backend, dipakai monitoring / load balancer.
    location = /healthz {
        access_log off;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend/health;
    }

    # Endpoint root hanya info gateway.
    location = / {
        default_type application/json;
        return 200 '{"service":"kawantumbuh-gateway","status":"ok"}';
    }

    location = /api/v1 {
        return 301 /api/v1/;
    }

    # Auth diberi limit lebih ketat untuk menahan brute force.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn conn_limit 10;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend;
    }

    # Semua endpoint API lain (users, children, sessions, ai, reports, ...).
    # Inference AI sinkron bisa lama, jadi read timeout dinaikkan.
    # (proxy_read_timeout 120s sudah disediakan oleh proxy_params.conf —
    #  tidak boleh ditulis lagi di sini, nginx menolak direktif duplikat.)
    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 20;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://api_backend;
    }

    # -----------------------------------------------------------------------
    # OPSIONAL - pass-through langsung ke layanan AI (sesuai diagram).
    # Default TIDAK aktif: semua /api/v1/ai/* tetap lewat NestJS agar
    # autentikasi, audit, dan penyimpanan hasil terpusat.
    #
    # Jika ingin mengaktifkan:
    #   1. tambahkan network "backend" ke service nginx di docker-compose.yml
    #   2. sediakan endpoint verifikasi token di backend (contoh: /auth/verify)
    #   3. hapus komentar blok di bawah
    # -----------------------------------------------------------------------
    # location /api/v1/ai/dysgraphia/ {
    #     auth_request /_auth;
    #     include /etc/nginx/proxy_params.conf;
    #     proxy_pass http://ai-dysgraphia:8002/;
    # }
    #
    # location = /_auth {
    #     internal;
    #     include /etc/nginx/proxy_params.conf;
    #     proxy_pass http://api_backend/api/v1/auth/verify;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    # }

    # Selain route di atas tidak ada yang dilayani.
    location / {
        default_type application/json;
        return 404 '{"statusCode":404,"message":"Not Found"}';
    }
}

