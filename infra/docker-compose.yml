name: kawantumbuh

# ---------------------------------------------------------------------------
# KAWANTUMBUH - Docker Compose untuk VPS Ubuntu
#
# Topologi:
#   internet -> nginx (80/443) -> api (NestJS) -> db (PostgreSQL)
#                                        \-----> ai-* (FastAPI)
#
# Hanya nginx yang membuka port ke host. Semua service lain hanya
# berkomunikasi lewat network internal Docker.
#
# Perintah:
#   cp .env.example .env
#   docker compose up -d --build
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped
  logging: *default-logging

services:
  # -------------------------------------------------------------------------
  # Reverse proxy / API gateway
  # -------------------------------------------------------------------------
  nginx:
    <<: *default-restart
    image: nginx:1.27-alpine
    container_name: kawantumbuh-nginx
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # -------------------------------------------------------------------------
  # Backend NestJS (modular monolith)
  # -------------------------------------------------------------------------
  api:
    <<: *default-restart
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: kawantumbuh/api:local
    container_name: kawantumbuh-api
    depends_on:
      db:
        condition: service_healthy
      ai-dysgraphia:
        condition: service_healthy
      ai-dyslexia:
        condition: service_healthy
      ai-dyscalculia:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      # CATATAN: ganti NODE_ENV ke production setelah migrasi TypeORM tersedia.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-kawantumbuh}:${POSTGRES_PASSWORD:-kawantumbuh}@db:5432/${POSTGRES_DB:-kawantumbuh}}
      JWT_SECRET: ${JWT_SECRET:-kawantumbuh-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AI_DYSGRAPHIA_URL: http://ai-dysgraphia:8002
      AI_DYSLEXIA_URL: http://ai-dyslexia:8003
      AI_DYSCALCULIA_URL: http://ai-dyscalculia:8004
      AI_SENTIMENT_URL: ${AI_SENTIMENT_URL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/media
      STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-12}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-kawantumbuh}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - media_data:/data/media
    expose:
      - "3000"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  db:
    <<: *default-restart
    image: postgres:16-alpine
    container_name: kawantumbuh-db
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      POSTGRES_DB: ${POSTGRES_DB:-kawantumbuh}
      POSTGRES_USER: ${POSTGRES_USER:-kawantumbuh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kawantumbuh}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    expose:
      - "5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kawantumbuh} -d ${POSTGRES_DB:-kawantumbuh}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  # -------------------------------------------------------------------------
  # AI service: disgrafia (analisis citra tulisan tangan)
  # -------------------------------------------------------------------------
  ai-dysgraphia:
    <<: *default-restart
    build:
      context: ../services/ai/dysgraphia
      dockerfile: Dockerfile
    image: kawantumbuh/ai-dysgraphia:local
    container_name: kawantumbuh-ai-dysgraphia
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    expose:
      - "8002"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  # -------------------------------------------------------------------------
  # AI service: disleksia (analisis audio membaca)
  # -------------------------------------------------------------------------
  ai-dyslexia:
    <<: *default-restart
    build:
      context: ../services/ai/dyslexia
      dockerfile: Dockerfile
    image: kawantumbuh/ai-dyslexia:local
    container_name: kawantumbuh-ai-dyslexia
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    expose:
      - "8003"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  # -------------------------------------------------------------------------
  # AI service: diskalkulia (analisis sesi subitizing)
  # -------------------------------------------------------------------------
  ai-dyscalculia:
    <<: *default-restart
    build:
      context: ../services/ai/dyscalculia
      dockerfile: Dockerfile
    image: kawantumbuh/ai-dyscalculia:local
    container_name: kawantumbuh-ai-dyscalculia
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    expose:
      - "8004"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # -------------------------------------------------------------------------
  # OPSIONAL - aktifkan dengan: docker compose --profile ai-sentiment up -d
  # Butuh models/sentiment_model.pkl (jalankan save_model.py lebih dulu).
  # -------------------------------------------------------------------------
  ai-sentiment:
    <<: *default-restart
    profiles: ["ai-sentiment"]
    build:
      context: ../services/ai/sentiment
      dockerfile: Dockerfile
    image: kawantumbuh/ai-sentiment:local
    container_name: kawantumbuh-ai-sentiment
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ../services/ai/sentiment/models:/app/models:ro
    expose:
      - "8005"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # -------------------------------------------------------------------------
  # OPSIONAL - object storage S3-compatible
  # Aktifkan dengan: docker compose --profile storage up -d
  # Console: http://127.0.0.1:9001 (hanya dari host, tidak dari internet)
  # -------------------------------------------------------------------------
  minio:
    <<: *default-restart
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: kawantumbuh-minio
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend

  # -------------------------------------------------------------------------
  # OPSIONAL - antrean job (BullMQ) untuk inference async
  # Aktifkan dengan: docker compose --profile queue up -d
  # -------------------------------------------------------------------------
  redis:
    <<: *default-restart
    profiles: ["queue"]
    image: redis:7-alpine
    container_name: kawantumbuh-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: false

volumes:
  pg_data:
  media_data:
  nginx_logs:
  minio_data:
  redis_data:
